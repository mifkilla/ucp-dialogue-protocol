name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Continuity regressions
        run: python -B -m unittest discover -s experiments/continuity -v
      - name: Observer regressions
        run: python -B -m unittest discover -s experiments/observer -v
      - name: Final pilot regressions
        run: python -B -m unittest discover -s experiments/final -v
